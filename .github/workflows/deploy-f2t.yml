name: Deploy AI Server

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ml-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd ai-server
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

    - name: Configure SSH
      env:
        BASTION_HOST: ${{ secrets.BASTION_HOST }}
        ML_SERVER_HOST: ${{ secrets.ML_SERVER_HOST }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        cat >> ~/.ssh/config <<EOF
        Host bastion
            HostName $BASTION_HOST
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 60
        
        Host ml-server
            HostName $ML_SERVER_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            ServerAliveInterval 60
        EOF

    - name: Deploy to ML Server
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        BACKEND_ALB_DNS: ${{ secrets.BACKEND_ALB_DNS }}
        CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN }}
      run: |
        ssh ml-server << 'ENDSSH'
          set -e
          
          cd ~/ML/ml-server
          
          # Create .env.prod file
          cat > .env.prod << 'EOF'
        DEBUG=false
        LOG_LEVEL=INFO
        MODEL_PATH=./models/gesture_model.h5
        LABELS_PATH=./models/label_map.json
        BACKEND_URL=http://${BACKEND_ALB_DNS}
        BACKEND_TOKEN_VERIFY_ENDPOINT=/api/auth/verify-token
        ALLOWED_ORIGINS=["https://${FRONTEND_DOMAIN}","https://${CLOUDFRONT_DOMAIN}","http://${BACKEND_ALB_DNS}"]
        CLAUDE_API_KEY=${CLAUDE_API_KEY}
        CLAUDE_MODEL=claude-3-haiku-20240307
        CLAUDE_MAX_TOKENS=200
        REDIS_URL=redis://redis:6379
        REDIS_HOST=redis
        REDIS_PORT=6379
        BEDROCK_CACHE_TTL=3600
        AI_SERVER_HOST=0.0.0.0
        AI_SERVER_PORT=8000
        MAX_CONNECTIONS=100
        FRAME_BUFFER_SIZE=10
        ENABLE_FRAME_PROCESSING=true
        FRAME_BATCH_SIZE=10
        MEDIAPIPE_MODEL_COMPLEXITY=1
        FRAME_PROCESSING_THREADS=2
        FRAME_PROCESSING_TIMEOUT=30
        EOF
          
          sed -i "s|\${BACKEND_ALB_DNS}|${BACKEND_ALB_DNS}|g" .env.prod
          sed -i "s|\${FRONTEND_DOMAIN}|${FRONTEND_DOMAIN}|g" .env.prod
          sed -i "s|\${CLOUDFRONT_DOMAIN}|${CLOUDFRONT_DOMAIN}|g" .env.prod
          sed -i "s|\${CLAUDE_API_KEY}|${CLAUDE_API_KEY}|g" .env.prod
          
          # Update docker-compose to use ECR image
          cat > docker-compose.prod.yml << 'EOFCOMPOSE'
        version: '3.8'

        services:
          f2t-server:
            image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
            ports:
              - "8000:8000"
            volumes:
              - ./models:/app/models:ro
              - ./logs:/app/logs
            env_file:
              - .env.prod
            restart: unless-stopped
            healthcheck:
              test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
              interval: 30s
              timeout: 10s
              retries: 3
              start_period: 60s
            deploy:
              resources:
                limits:
                  memory: 3G
                reservations:
                  memory: 2G
            networks:
              - app-network
            depends_on:
              - redis

          redis:
            image: redis:7-alpine
            ports:
              - "6379:6379"
            volumes:
              - redis_data:/data
            restart: unless-stopped
            networks:
              - app-network
            command: redis-server --appendonly yes

        volumes:
          redis_data:

        networks:
          app-network:
            driver: bridge
        EOFCOMPOSE
          
          # ECR에서 이미지 Pull
          export ECR_REGISTRY=${ECR_REGISTRY}
          export ECR_REPOSITORY=${ECR_REPOSITORY}
          export IMAGE_TAG=${IMAGE_TAG}
          
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Health check failed!"
              docker compose -f docker-compose.prod.yml logs
              exit 1
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
          
          docker compose -f docker-compose.prod.yml ps
        ENDSSH

    - name: Verify deployment
      run: |
        ssh ml-server 'docker compose -f ~/ML/ml-server/docker-compose.prod.yml logs --tail=50'