name: Deploy AI Server

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure SSH
      env:
        BASTION_HOST: ${{ secrets.BASTION_HOST }}
        ML_SERVER_HOST: ${{ secrets.ML_SERVER_HOST }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        cat >> ~/.ssh/config <<EOF
        Host bastion
            HostName $BASTION_HOST
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 60
        
        Host ml-server
            HostName $ML_SERVER_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            ServerAliveInterval 60
        EOF

    - name: Upload models to ML server (if exists)
      run: |
        if [ -d "./models" ]; then
          scp -r ./models ml-server:~/ML/ml-server/
        fi

    - name: Deploy to ML Server
      env:
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        BACKEND_ALB_DNS: ${{ secrets.BACKEND_ALB_DNS }}
        CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN }}
      run: |
        ssh ml-server << 'ENDSSH'
          set -e
          
          # 디렉토리 이동
          cd ~/ML/ml-server
          
          # Git Pull
          git fetch origin
          git reset --hard origin/main
          
          # Create .env.prod file
          cat > .env.prod << 'EOF'
        # Server settings
        DEBUG=false
        LOG_LEVEL=INFO

        # Model paths
        MODEL_PATH=./models/gesture_model.h5
        LABELS_PATH=./models/label_map.json

        # Backend settings
        BACKEND_URL=http://${BACKEND_ALB_DNS}
        BACKEND_TOKEN_VERIFY_ENDPOINT=/api/auth/verify-token

        # CORS settings
        ALLOWED_ORIGINS=["https://${FRONTEND_DOMAIN}","https://${CLOUDFRONT_DOMAIN}","http://${BACKEND_ALB_DNS}"]

        # Claude API
        CLAUDE_API_KEY=${CLAUDE_API_KEY}
        CLAUDE_MODEL=claude-3-haiku-20240307
        CLAUDE_MAX_TOKENS=200

        # Redis settings
        REDIS_URL=redis://redis:6379
        REDIS_HOST=redis
        REDIS_PORT=6379
        BEDROCK_CACHE_TTL=3600

        # Server settings
        AI_SERVER_HOST=0.0.0.0
        AI_SERVER_PORT=8000

        # WebSocket settings
        MAX_CONNECTIONS=100
        FRAME_BUFFER_SIZE=10

        # F2T 전용 환경 변수
        ENABLE_FRAME_PROCESSING=true
        FRAME_BATCH_SIZE=10
        MEDIAPIPE_MODEL_COMPLEXITY=1
        FRAME_PROCESSING_THREADS=2
        FRAME_PROCESSING_TIMEOUT=30
        EOF
          
          # Replace environment variables in .env.prod
          sed -i "s|\${BACKEND_ALB_DNS}|${BACKEND_ALB_DNS}|g" .env.prod
          sed -i "s|\${FRONTEND_DOMAIN}|${FRONTEND_DOMAIN}|g" .env.prod
          sed -i "s|\${CLOUDFRONT_DOMAIN}|${CLOUDFRONT_DOMAIN}|g" .env.prod
          sed -i "s|\${CLAUDE_API_KEY}|${CLAUDE_API_KEY}|g" .env.prod
          
          # Ensure directories exist
          mkdir -p models logs
          
          # Stop existing containers
          docker compose -f docker-compose.prod.yml down || true
          
          # Remove old images
          docker system prune -af --volumes
          
          # Wait a moment
          sleep 2
          
          # Build and start new containers
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
          
          # Wait for health check
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Health check failed!"
              docker compose -f docker-compose.prod.yml logs
              exit 1
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
          
          # Show running containers
          docker compose -f docker-compose.prod.yml ps
          
          # Show service logs
          docker compose -f docker-compose.prod.yml logs --tail=20
        ENDSSH

    - name: Verify deployment
      run: |
        ssh ml-server 'docker compose -f ~/ML/ml-server/docker-compose.prod.yml logs --tail=50'

    - name: Notify deployment result
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ AI Server deployment successful!"
        else
          echo "❌ AI Server deployment failed!"
          exit 1
        fi