services:
  f2t-server:
    image: ${DOCKER_IMAGE}:${TAG}  # build: . 대신 이미지 지정
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    environment:
      # Server settings
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_SERVER_HOST=${AI_SERVER_HOST:-0.0.0.0}
      - AI_SERVER_PORT=${AI_SERVER_PORT:-8000}
      
      # Model paths
      - MODEL_PATH=${MODEL_PATH:-/app/models/gesture_model.h5}
      - LABELS_PATH=${LABELS_PATH:-/app/models/label_map.json}
      
      # Backend settings
      - BACKEND_URL=${BACKEND_URL}
      - BACKEND_TOKEN_VERIFY_ENDPOINT=${BACKEND_TOKEN_VERIFY_ENDPOINT:-/api/auth/verify-token}
      
      # CORS settings
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      
      # Claude API
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-haiku-20240307}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-200}
      
      # Redis settings
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - BEDROCK_CACHE_TTL=${BEDROCK_CACHE_TTL:-3600}
      
      # WebSocket settings
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-100}
      - FRAME_BUFFER_SIZE=${FRAME_BUFFER_SIZE:-10}
      
      # F2T 전용 환경 변수
      - ENABLE_FRAME_PROCESSING=${ENABLE_FRAME_PROCESSING:-true}
      - FRAME_BATCH_SIZE=${FRAME_BATCH_SIZE:-10}
      - MEDIAPIPE_MODEL_COMPLEXITY=${MEDIAPIPE_MODEL_COMPLEXITY:-1}
      - FRAME_PROCESSING_THREADS=${FRAME_PROCESSING_THREADS:-2}
      - FRAME_PROCESSING_TIMEOUT=${FRAME_PROCESSING_TIMEOUT:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge