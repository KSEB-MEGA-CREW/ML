version: '3.8'

services:
  f2t-server:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    environment:
      - DEBUG=false
      - MODEL_PATH=/app/models/gesture_model.h5
      - LABELS_PATH=/app/models/label_map.json
      - BACKEND_URL=http://host.docker.internal:8080
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-haiku-20240307}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
      # F2T 전용 환경 변수
      - ENABLE_FRAME_PROCESSING=true
      - FRAME_BATCH_SIZE=10
      - MEDIAPIPE_MODEL_COMPLEXITY=1
      - FRAME_PROCESSING_THREADS=2
      - FRAME_PROCESSING_TIMEOUT=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # 개발용 Redis (선택사항)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: